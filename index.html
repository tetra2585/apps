<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:title" content="tetra2585 Apps">
<meta property="og:description" content="毎日を、ちょっとやさしくする iPhone アプリ / Small apps for kinder days">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0A1A;
    --bg-deep: #07060F;
    --text: #F5F2FF;
    --sub: #B9B3DA;
    --faint: rgba(245, 242, 255, 0.55);
    --glass: rgba(255, 255, 255, 0.06);
    --glass-strong: rgba(255, 255, 255, 0.10);
    --line: rgba(255, 255, 255, 0.12);
    --violet: #8B74FF;
    --pink: #FF8FB3;
    --mint: #8FE3D0;
    --gold: #F5C77A;
    --lav: #CDB8FF;
    --font: "Zen Maru Gothic", -apple-system, "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    --font-en: "Outfit", -apple-system, "Segoe UI", sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  /* The page is designed as a night scene in both appearances; the light override keeps the same look. */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0B0A1A; } }
  :root[data-theme="dark"] { --bg: #0B0A1A; }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    line-height: 1.7;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  html[lang="en"] body { font-family: var(--font-en), var(--font); }
  img { display: block; max-width: 100%; }
  a { color: inherit; }

  /* ---------- Sky: aurora + stars + grain ---------- */
  .sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: radial-gradient(120% 80% at 50% -10%, #1C1640 0%, var(--bg) 55%, var(--bg-deep) 100%); }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; mix-blend-mode: screen; will-change: transform; }
  .b1 { width: 70vmax; height: 70vmax; left: -25vmax; top: -30vmax; background: radial-gradient(circle, #6C4CFF 0%, transparent 65%); animation: drift1 22s ease-in-out infinite alternate; }
  .b2 { width: 60vmax; height: 60vmax; right: -25vmax; top: 5vmax; background: radial-gradient(circle, #FF6FAE 0%, transparent 62%); opacity: .38; animation: drift2 26s ease-in-out infinite alternate; }
  .b3 { width: 55vmax; height: 55vmax; left: 10vmax; top: 55vh; background: radial-gradient(circle, #3FD6C0 0%, transparent 60%); opacity: .28; animation: drift3 30s ease-in-out infinite alternate; }
  .b4 { width: 45vmax; height: 45vmax; right: -10vmax; bottom: -20vmax; background: radial-gradient(circle, #F5B85A 0%, transparent 60%); opacity: .22; animation: drift1 34s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { to { transform: translate3d(12vmax, 8vmax, 0) scale(1.15); } }
  @keyframes drift2 { to { transform: translate3d(-14vmax, 10vmax, 0) scale(.9); } }
  @keyframes drift3 { to { transform: translate3d(8vmax, -12vmax, 0) scale(1.2); } }
  #stars { position: absolute; inset: 0; width: 100%; height: 100%; }
  .grain { position: absolute; inset: -50%; opacity: .07; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); animation: grain 1.2s steps(6) infinite; }
  @keyframes grain { 0% { transform: translate(0, 0); } 50% { transform: translate(-3%, 2%); } 100% { transform: translate(2%, -3%); } }

  main { position: relative; z-index: 1; }
  .wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 16px; }

  /* ---------- Top bar ---------- */
  .bar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; padding: max(12px, env(safe-area-inset-top)) 16px 12px; transition: background .4s, backdrop-filter .4s; }
  .bar.scrolled { background: rgba(11, 10, 26, 0.55); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); border-bottom: 1px solid var(--line); }
  .brand { font-family: var(--font-en); font-weight: 800; letter-spacing: .04em; font-size: 15px; display: flex; align-items: center; gap: 8px; text-decoration: none; }
  .brand i { width: 10px; height: 10px; border-radius: 50%; background: conic-gradient(var(--violet), var(--pink), var(--mint), var(--gold), var(--violet)); box-shadow: 0 0 14px var(--violet); animation: spin 6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .lang { display: flex; padding: 3px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .lang button { all: unset; cursor: pointer; font-size: 12.5px; font-weight: 700; padding: 6px 12px; border-radius: 999px; color: var(--sub); min-height: 20px; transition: background .3s, color .3s; }
  .lang button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .lang button:focus-visible { outline: 2px solid var(--lav); outline-offset: 2px; }

  /* ---------- Hero ---------- */
  .hero { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 96px 16px 64px; position: relative; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); font-family: var(--font-en); font-weight: 600; font-size: 12px; letter-spacing: .18em; color: var(--sub); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .eyebrow b { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 10px var(--mint); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; transform: scale(.7); } }
  h1 { margin: 22px 0 14px; font-weight: 900; font-size: clamp(32px, 9.4vw, 92px); line-height: 1.16; letter-spacing: -.01em; white-space: nowrap; }
  html[lang="en"] h1 { font-weight: 800; letter-spacing: -.03em; }
  .shimmer { background: linear-gradient(100deg, #FFFFFF 0%, var(--lav) 22%, var(--pink) 40%, var(--gold) 55%, var(--mint) 72%, #FFFFFF 92%); background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 9s ease-in-out infinite; }
  @keyframes shine { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  h1 .line { display: block; overflow: hidden; padding-bottom: .06em; }
  h1 .line > span { display: inline-block; transform: translateY(110%); animation: rise 1.1s var(--ease) forwards; }
  h1 .line:nth-child(2) > span { animation-delay: .14s; }
  @keyframes rise { to { transform: none; } }
  .lead { margin: 0 auto; max-width: 30em; color: var(--sub); font-size: clamp(15px, 3.8vw, 18px); opacity: 0; animation: fade 1s .5s var(--ease) forwards; }
  @keyframes fade { to { opacity: 1; } }

  .orbit { position: relative; width: min(340px, 82vw); height: min(340px, 82vw); margin: 34px auto 6px; opacity: 0; animation: fade 1.2s .7s var(--ease) forwards; }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px dashed rgba(255, 255, 255, .16); }
  .ring.r2 { inset: 16%; border-style: solid; border-color: rgba(255, 255, 255, .08); }
  .core { position: absolute; inset: 34%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, var(--lav) 25%, #6C4CFF 60%, transparent 72%); filter: blur(6px); opacity: .55; animation: breathe 5s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.15); opacity: .8; } }
  .sat { position: absolute; left: 50%; top: 50%; width: 0; height: 0; animation: orbit 18s linear infinite; }

  @keyframes orbit { to { transform: rotate(360deg); } }
  .sat a { position: absolute; left: calc(min(340px, 82vw) / 2 - 44px); top: -44px; width: 88px; height: 88px; display: block; border-radius: 24px; overflow: hidden; box-shadow: 0 14px 40px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .18), 0 0 40px var(--glow, rgba(139, 116, 255, .45)); animation: counter 18s linear infinite; transition: transform .3s var(--ease); }

  @keyframes counter { to { transform: rotate(-360deg); } }
  .sat a img { width: 100%; height: 100%; object-fit: cover; }
  .sat a span { position: absolute; left: 50%; bottom: -26px; transform: translateX(-50%); font-family: var(--font-en); font-size: 12px; font-weight: 800; letter-spacing: .06em; white-space: nowrap; color: var(--text); }
  .scroll-hint { margin-top: 26px; display: inline-flex; flex-direction: column; align-items: center; gap: 6px; color: var(--faint); font-size: 12px; text-decoration: none; opacity: 0; animation: fade 1s 1.2s forwards; }
  .scroll-hint i { width: 22px; height: 34px; border: 1.5px solid var(--faint); border-radius: 12px; position: relative; }
  .scroll-hint i::after { content: ""; position: absolute; left: 50%; top: 7px; width: 3px; height: 7px; margin-left: -1.5px; border-radius: 2px; background: var(--text); animation: wheel 1.8s ease-in-out infinite; }
  @keyframes wheel { 0% { opacity: 0; transform: translateY(-3px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(10px); } }
  .you-saw { margin-top: 18px; display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; background: linear-gradient(90deg, rgba(139, 116, 255, .25), rgba(255, 143, 179, .25)); border: 1px solid rgba(255, 255, 255, .22); font-weight: 700; font-size: 14px; text-decoration: none; opacity: 0; animation: fade 1s 1s forwards; }
  .you-saw[hidden] { display: none; }

  /* ---------- Chapters ---------- */
  .chapter { position: relative; padding: 56px 0 88px; }
  .chapter::before { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 50% at var(--gx, 70%) 40%, var(--tint) 0%, transparent 70%); opacity: .45; pointer-events: none; }
  .chapter { --gx: 72%; }
  .chapter.flip { --gx: 28%; }
  .grid { display: grid; gap: 22px; grid-template-areas: "head" "stage" "body"; }
  .grid > .head { grid-area: head; }
  .grid > .stage { grid-area: stage; margin: 6px 0 30px; }
  .grid > .body { grid-area: body; }
  @media (min-width: 860px) {
    .grid { grid-template-columns: 1.05fr .95fr; grid-template-areas: "head stage" "body stage"; column-gap: 56px; row-gap: 0; align-items: end; }
    .grid > .body { align-self: start; }
    .grid > .stage { margin: 0; }
    .chapter.flip .grid { grid-template-columns: .95fr 1.05fr; grid-template-areas: "stage head" "stage body"; }
  }
  .num { font-family: var(--font-en); font-weight: 800; font-size: clamp(64px, 16vw, 132px); line-height: .9; color: transparent; -webkit-text-stroke: 1.5px rgba(255, 255, 255, .22); letter-spacing: -.04em; margin: 0 0 4px; }
  .app-head { display: flex; align-items: center; gap: 16px; margin-top: 8px; }
  .app-icon { width: 76px; height: 76px; border-radius: 20px; box-shadow: 0 12px 34px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .16); flex: none; }
  .app-name { margin: 0; font-family: var(--font-en); font-weight: 800; font-size: clamp(36px, 9vw, 60px); letter-spacing: -.02em; line-height: 1.05; }
  .app-name em { font-style: normal; background: linear-gradient(90deg, #FFFFFF, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tagline { margin: 4px 0 0; color: var(--sub); font-weight: 700; font-size: clamp(14px, 3.6vw, 17px); }
  .desc { margin: 22px 0 0; font-size: clamp(16px, 4.2vw, 19px); line-height: 1.85; }
  .feats { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 10px; }
  .feats li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); font-weight: 700; font-size: 15px; }
  .feats li b { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; flex: none; font-size: 17px; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 6px 18px rgba(0, 0, 0, .25); }

  .cta { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 26px; min-height: 58px; padding: 0 26px; border-radius: 18px; text-decoration: none; font-weight: 900; font-size: 17px; color: #120F24; background: linear-gradient(100deg, #FFFFFF 0%, var(--accent) 55%, var(--accent2) 100%); box-shadow: 0 16px 40px rgba(139, 116, 255, .35), inset 0 1px 0 rgba(255, 255, 255, .7); transition: transform .25s var(--ease), box-shadow .25s; }
  .cta::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .85), transparent); transform: skewX(-20deg); animation: sweep 3.6s 1.5s ease-in-out infinite; }
  @keyframes sweep { 0%, 60% { left: -60%; } 100% { left: 130%; } }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 22px 50px rgba(139, 116, 255, .45), inset 0 1px 0 rgba(255, 255, 255, .7); }
  .cta:active { transform: scale(.98); }
  .cta svg { width: 20px; height: 20px; }
  .price { margin: 10px 0 0; text-align: center; color: var(--faint); font-size: 13px; }

  /* ---------- Phone ---------- */
  .stage { position: relative; height: min(640px, 150vw); perspective: 1400px; display: grid; place-items: center; }
  .phone { position: relative; width: min(290px, 66vw); aspect-ratio: 1206 / 2622; border-radius: 15% / 7%; padding: 3.2%; background: linear-gradient(145deg, #3A3554, #14121F 45%, #2B2740); box-shadow: 0 0 0 1px rgba(255, 255, 255, .14), 0 40px 90px rgba(0, 0, 0, .55), 0 0 90px var(--glow, rgba(139, 116, 255, .35)); transform-style: preserve-3d; transform: rotateY(var(--ry, -12deg)) rotateX(var(--rx, 6deg)); transition: transform .5s var(--ease); will-change: transform; }
  .phone::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; background: linear-gradient(120deg, rgba(255, 255, 255, .35), transparent 30%, transparent 70%, rgba(255, 255, 255, .15)); pointer-events: none; mix-blend-mode: overlay; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 12.5% / 5.8%; overflow: hidden; background: #000; }
  .screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.04); transition: opacity 1s var(--ease), transform 4s linear; }
  .screen img.on { opacity: 1; transform: scale(1); }
  .island { position: absolute; top: 2.6%; left: 50%; width: 30%; height: 3.3%; transform: translateX(-50%); background: #000; border-radius: 999px; z-index: 2; }
  .glare { position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(115deg, rgba(255, 255, 255, .18) 0%, transparent 35%); pointer-events: none; z-index: 3; }
  .dots { position: absolute; bottom: -34px; left: 50%; transform: translateX(-50%); display: flex; gap: 7px; }
  .dots i { width: 7px; height: 7px; border-radius: 99px; background: rgba(255, 255, 255, .25); transition: width .4s var(--ease), background .4s; }
  .dots i.on { width: 22px; background: var(--text); }
  .mascot { position: absolute; width: min(190px, 40vw); z-index: 4; filter: drop-shadow(0 16px 30px rgba(0, 0, 0, .45)); animation: float 5.5s ease-in-out infinite; }
  .chapter .mascot { right: max(0px, calc(50% - min(290px, 66vw) / 2 - 90px)); bottom: 6%; }
  .chapter.flip .mascot { right: auto; left: max(0px, calc(50% - min(290px, 66vw) / 2 - 90px)); bottom: 8%; animation-delay: -2s; }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-16px) rotate(3deg); } }
  .halo { position: absolute; width: 120%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, var(--tint) 0%, transparent 62%); filter: blur(10px); }
  .sparkle { position: absolute; width: 14px; height: 14px; background: radial-gradient(circle, #FFFFFF 0%, transparent 70%); border-radius: 50%; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1); } }

  /* ---------- Reveal ---------- */
  .reveal { opacity: 0; transform: translateY(36px); filter: blur(8px); transition: opacity 1s var(--ease), transform 1s var(--ease), filter 1s var(--ease); transition-delay: var(--d, 0s); }
  .reveal.in { opacity: 1; transform: none; filter: none; }

  /* ---------- Footer ---------- */
  footer { position: relative; z-index: 1; padding: 40px 16px max(48px, env(safe-area-inset-bottom)); text-align: center; color: var(--faint); font-size: 13px; }
  footer .sig { font-family: var(--font-en); font-weight: 800; letter-spacing: .14em; font-size: 12px; color: var(--sub); }
  footer nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 16px; margin: 12px 0; }
  footer nav a { color: var(--sub); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 1px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    h1 .line > span, .lead, .orbit, .scroll-hint, .you-saw { transform: none; opacity: 1; }
    .reveal { opacity: 1; transform: none; filter: none; }
    .screen img { transition: none; }
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  <canvas id="stars"></canvas>
  <div class="grain"></div>
</div>

<header class="bar" id="bar">
  <a class="brand" href="#top"><i></i>tetra2585</a>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="ja">日本語</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>

<main id="top">
  <section class="hero">
    <span class="eyebrow"><b></b><span data-t="eyebrow"></span></span>
    <h1><span class="line"><span class="shimmer" data-t="h1a"></span></span><span class="line"><span class="shimmer" data-t="h1b"></span></span></h1>
    <p class="lead" data-t="lead"></p>
    <div class="orbit" aria-hidden="true">
      <div class="ring"></div><div class="ring r2"></div><div class="core"></div>
      <div id="sats"></div>
    </div>
    <a class="you-saw" id="you-saw" hidden></a>
    <a class="scroll-hint" href="#apps"><i></i><span data-t="scroll"></span></a>
  </section>

  <div id="apps"></div>
</main>

<footer>
  <div class="sig">MADE WITH CARE · KEISUKE TOMONAGA</div>
  <nav id="links"></nav>
  <div>© 2026 KEISUKE TOMONAGA · <span data-t="footer"></span></div>
</footer>

<script>
(function () {
  // App Store の印 (どの SNS から来たか)。App Store Connect → アナリティクス → キャンペーンで、SNS ごとのダウンロード数がわかる
  var SOURCES = ['tiktok', 'instagram', 'youtube', 'x', 'threads'];
  // アプリの一覧は apps.json (追加は scripts/add-app.py)
  var PROVIDER = '';
  var APPS = [];

  var TEXT = {
    ja: { eyebrow: 'INDIE APPS · iPhone', h1a: '毎日を、', h1b: 'ちょっとやさしく。', lead: 'ひとりで作っている iPhone アプリです。スマホとの付き合い方や、大切な人との毎日を、少しだけ良くするために。', scroll: 'スクロール', cta: 'App Store で見る', saw: '動画で見たのは {name} ↓', footer: 'iPhone 向けアプリ', support: '{name} のサポート' },
    en: { eyebrow: 'INDIE APPS · iPhone', h1a: 'Small apps for', h1b: 'kinder days.', lead: 'iPhone apps I make on my own — for a better relationship with your phone, and with the people you love.', scroll: 'Scroll', cta: 'View on the App Store', saw: 'The app from the video: {name} ↓', footer: 'Apps for iPhone', support: '{name} support' }
  };

  var params = new URLSearchParams(location.search);
  var src = (params.get('src') || '').toLowerCase();
  var campaign = SOURCES.indexOf(src) >= 0 ? src : 'lp';
  var focus = (params.get('app') || '').toLowerCase();
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function storeUrl(app) { return 'https://apps.apple.com/app/apple-store/id' + app.storeId + '?pt=' + PROVIDER + '&ct=' + campaign + '&mt=8'; }
  function fmt(s, v) { return s.replace(/\{(\w+)\}/g, function (_, k) { return v[k]; }); }
  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    for (var k in attrs || {}) { if (k === 'text') n.textContent = attrs[k]; else if (k === 'cls') n.className = attrs[k]; else n.setAttribute(k, attrs[k]); }
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  function pickLanguage() {
    var asked = (params.get('lang') || '').toLowerCase();
    if (asked === 'ja' || asked === 'en') return asked;
    try { var saved = localStorage.getItem('apps-lang'); if (saved === 'ja' || saved === 'en') return saved; } catch (e) {}
    return (navigator.language || 'en').toLowerCase().indexOf('ja') === 0 ? 'ja' : 'en';
  }

  var timers = [];
  function chapter(app, index, lang) {
    var t = app[lang];
    var shots = app.screens.map(function (s, i) { return el('img', { src: 'assets/' + app.id + '-' + s + '-' + lang + '.jpg', alt: '', cls: i === 0 ? 'on' : '', loading: index === 0 ? 'eager' : 'lazy', decoding: 'async' }); });
    var dots = el('div', { cls: 'dots', 'aria-hidden': 'true' }, app.screens.map(function (_, i) { return el('i', { cls: i === 0 ? 'on' : '' }); }));
    var phone = el('div', { cls: 'phone', style: '--glow:' + (app.theme || {}).glow }, [el('div', { cls: 'screen' }, [el('div', { cls: 'island' })].concat(shots).concat([el('div', { cls: 'glare' })])), dots]);
    var sparkles = [0, 1, 2, 3, 4].map(function (i) {
      return el('i', { cls: 'sparkle', style: 'left:' + [12, 82, 20, 76, 50][i] + '%;top:' + [18, 26, 74, 70, 8][i] + '%;animation-delay:' + (i * 0.6) + 's' });
    });
    var stage = el('div', { cls: 'stage reveal', style: '--d:.1s', 'aria-hidden': 'true' }, [el('div', { cls: 'halo' })].concat(sparkles).concat([phone, el('img', { cls: 'mascot', src: app.mascot, alt: t.mascotAlt, loading: 'lazy' })]));

    var head = el('div', { cls: 'head' }, [
      el('p', { cls: 'num reveal', text: '0' + (index + 1), 'aria-hidden': 'true' }),
      el('div', { cls: 'app-head reveal', style: '--d:.06s' }, [
        el('img', { cls: 'app-icon', src: app.icon, alt: '', width: '76', height: '76' }),
        el('div', null, [(function () { var h = el('h2', { cls: 'app-name' }); h.appendChild(el('em', { text: app.name })); return h; })(), el('p', { cls: 'tagline', text: t.tagline })])
      ])
    ]);
    var copy = el('div', { cls: 'body' }, [
      el('p', { cls: 'desc reveal', style: '--d:.12s', text: t.desc }),
      el('ul', { cls: 'feats' }, t.feats.map(function (f, i) { return el('li', { cls: 'reveal', style: '--d:' + (0.16 + i * 0.07) + 's' }, [el('b', { text: f[0], 'aria-hidden': 'true' }), el('span', { text: f[1] })]); })),
      (function () {
        var a = el('a', { cls: 'cta reveal', style: '--d:.36s', href: storeUrl(app), rel: 'noopener' });
        a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';
        a.appendChild(document.createTextNode(TEXT[lang].cta));
        return a;
      })(),
      el('p', { cls: 'price reveal', style: '--d:.4s', text: t.price })
    ]);

    var th = app.theme || {};
    var section = el('section', { cls: 'chapter' + (index % 2 ? ' flip' : ''), id: app.id, 'aria-label': app.name, style: '--tint:' + th.tint + ';--accent:' + th.accent + ';--accent2:' + th.accent2 }, [el('div', { cls: 'wrap grid' }, [head, stage, copy])]);

    // 画面を数秒ごとに切り替える
    if (!reduceMotion) {
      var at = 0;
      timers.push(setInterval(function () {
        shots[at].classList.remove('on'); dots.children[at].classList.remove('on');
        at = (at + 1) % shots.length;
        shots[at].classList.add('on'); dots.children[at].classList.add('on');
      }, 2800 + index * 400));
    }
    return { section: section, phone: phone, stage: stage };
  }

  var phones = [];
  function render(lang) {
    timers.forEach(clearInterval); timers = []; phones = [];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(function (n) { n.textContent = TEXT[lang][n.getAttribute('data-t')]; });
    document.querySelectorAll('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)); });

    var ordered = APPS.slice().sort(function (a, b) { return (b.id === focus) - (a.id === focus); });
    var host = document.getElementById('apps');
    host.textContent = '';
    ordered.forEach(function (app, i) { var c = chapter(app, i, lang); host.appendChild(c.section); phones.push(c); });

    var saw = document.getElementById('you-saw');
    var focused = APPS.filter(function (a) { return a.id === focus; })[0];
    if (focused) { saw.hidden = false; saw.href = '#' + focused.id; saw.textContent = fmt(TEXT[lang].saw, { name: focused.name }); } else { saw.hidden = true; }

    var sats = document.getElementById('sats');
    sats.textContent = '';
    APPS.forEach(function (app, i) {
      var delay = -(18 / APPS.length) * i + 's';
      var a = el('a', { href: '#' + app.id, tabindex: '-1', style: '--glow:' + (app.theme || {}).glow + ';animation-delay:' + delay }, [el('img', { src: app.icon, alt: '' }), el('span', { text: app.name })]);
      sats.appendChild(el('div', { cls: 'sat', style: 'animation-delay:' + delay }, [a]));
    });

    var links = document.getElementById('links');
    links.textContent = '';
    APPS.forEach(function (app) { links.appendChild(el('a', { href: app.support, text: fmt(TEXT[lang].support, { name: app.name }) })); });

    observe();
  }

  // 画面に入ったら浮かび上がる
  var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: 0.15, rootMargin: '0px 0px -6% 0px' }) : null;
  function observe() {
    document.querySelectorAll('.reveal').forEach(function (n) { if (io && !reduceMotion) io.observe(n); else n.classList.add('in'); });
  }

  // 電話の傾き: 指やマウスの位置と、スクロールに合わせる
  var pointer = { x: 0, y: 0 };
  window.addEventListener('pointermove', function (e) { pointer.x = e.clientX / window.innerWidth - 0.5; pointer.y = e.clientY / window.innerHeight - 0.5; }, { passive: true });
  function tilt() {
    var vh = window.innerHeight;
    phones.forEach(function (p, i) {
      var r = p.stage.getBoundingClientRect();
      var c = (r.top + r.height / 2 - vh / 2) / vh; // -1 .. 1
      var side = i % 2 ? 1 : -1;
      p.phone.style.setProperty('--ry', (side * 12 + pointer.x * 16 - c * side * 10).toFixed(2) + 'deg');
      p.phone.style.setProperty('--rx', (6 + c * 10 - pointer.y * 10).toFixed(2) + 'deg');
    });
    document.getElementById('bar').classList.toggle('scrolled', window.scrollY > 24);
    requestAnimationFrame(tilt);
  }

  // 星空 (またたく点と、ゆっくり流れる星)
  function stars() {
    var cv = document.getElementById('stars'); var ctx = cv.getContext('2d'); var dpr = Math.min(2, window.devicePixelRatio || 1); var list = []; var shoot = null;
    function size() {
      cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
      var n = Math.round((innerWidth * innerHeight) / 5200);
      list = []; for (var i = 0; i < n; i++) list.push({ x: Math.random() * cv.width, y: Math.random() * cv.height, r: (Math.random() * 1.2 + 0.3) * dpr, p: Math.random() * 6.28, s: 0.6 + Math.random() * 1.6 });
    }
    size(); addEventListener('resize', size);
    function draw(t) {
      ctx.clearRect(0, 0, cv.width, cv.height);
      var off = window.scrollY * 0.15 * dpr;
      for (var i = 0; i < list.length; i++) {
        var s = list[i]; var a = 0.35 + 0.65 * Math.abs(Math.sin(s.p + t / 1000 * s.s));
        var y = (s.y - off) % cv.height; if (y < 0) y += cv.height;
        ctx.globalAlpha = a; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, y, s.r, 0, 6.283); ctx.fill();
      }
      if (!shoot && Math.random() < 0.004) shoot = { x: Math.random() * cv.width * 0.8, y: Math.random() * cv.height * 0.4, l: 0 };
      if (shoot) {
        shoot.l += 18 * dpr; var len = 120 * dpr; var g = ctx.createLinearGradient(shoot.x + shoot.l, shoot.y + shoot.l * 0.45, shoot.x + shoot.l - len, shoot.y + (shoot.l - len) * 0.45);
        g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.globalAlpha = 1; ctx.strokeStyle = g; ctx.lineWidth = 1.6 * dpr; ctx.beginPath();
        ctx.moveTo(shoot.x + shoot.l, shoot.y + shoot.l * 0.45); ctx.lineTo(shoot.x + shoot.l - len, shoot.y + (shoot.l - len) * 0.45); ctx.stroke();
        if (shoot.l > cv.width * 0.6) shoot = null;
      }
      if (!reduceMotion) requestAnimationFrame(draw);
    }
    if (reduceMotion) { draw(0); } else { requestAnimationFrame(draw); }
  }

  document.querySelectorAll('.lang button').forEach(function (b) {
    b.addEventListener('click', function () { var l = b.getAttribute('data-lang'); try { localStorage.setItem('apps-lang', l); } catch (e) {} render(l); });
  });

  // 見出しはすぐ出し、アプリは apps.json が届いてから並べる
  render(pickLanguage());
  stars();
  fetch('apps.json', { cache: 'no-cache' })
    .then(function (r) { return r.json(); })
    .then(function (data) { PROVIDER = data.provider; APPS = data.apps; render(pickLanguage()); })
    .catch(function () { document.getElementById('apps').textContent = ''; });
  if (!reduceMotion) requestAnimationFrame(tilt); else document.getElementById('bar').classList.add('scrolled');
})();
</script>
</body>
</html>
